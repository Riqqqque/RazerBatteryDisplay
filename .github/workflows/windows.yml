name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features --locked

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages[0].version
          $tag = $env:GITHUB_REF.Substring('refs/tags/'.Length)
          if ($tag -ne "v$version") {
            throw "Tag $tag does not match Cargo package version v$version"
          }

      - name: Build release
        run: cargo build --release --locked

      - name: Stage setup exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\razer-battery-display.exe dist\RazerBatteryDisplaySetup.exe -Force
          $hash = (Get-FileHash dist\RazerBatteryDisplaySetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RazerBatteryDisplaySetup.exe" | Set-Content dist\RazerBatteryDisplaySetup.exe.sha256 -Encoding ascii

      - name: Upload setup exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RazerBatteryDisplaySetup
          path: |
            dist/RazerBatteryDisplaySetup.exe
            dist/RazerBatteryDisplaySetup.exe.sha256
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download setup exe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: RazerBatteryDisplaySetup
          path: dist

      - name: Attach setup exe to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/RazerBatteryDisplaySetup.exe
            dist/RazerBatteryDisplaySetup.exe.sha256
          generate_release_notes: true
